services:
  api:
    build: .
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    expose:
      - "8000"
    networks:
      proxy:
        aliases:
          - famfibot-api
      default: {}

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: family_finance
      POSTGRES_USER: family_finance
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U family_finance -d family_finance"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
networks:
  proxy:
    external: true
