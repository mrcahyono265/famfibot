[project]
name = "family-finance-bot"
version = "0.1.0"
description = "Telegram-first multi-workspace financial recording system"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14",
    "fastapi>=0.115",
    "httpx>=0.28",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.7",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.34",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app", "app.services"]

[dependency-groups]
dev = ["pytest>=8.3"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
